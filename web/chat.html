<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>chatai</title>
<style>
  :root { color-scheme: light dark; }
  * { box-sizing: border-box; }
  body { margin: 0; height: 100vh; display: flex; flex-direction: column;
         font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
         background: #0f1115; color: #e8eaed; }
  header { display: flex; align-items: center; justify-content: space-between;
           padding: 12px 16px; border-bottom: 1px solid #2a2e37; }
  header .who { font-size: 14px; color: #9aa0ac; }
  header a { color: #9aa0ac; font-size: 13px; text-decoration: none; border: 1px solid #2a2e37;
             padding: 6px 12px; border-radius: 8px; }
  #chat { flex: 1; overflow-y: auto; padding: 16px; display: flex; flex-direction: column; gap: 10px; }
  .msg { max-width: 80%; padding: 10px 14px; border-radius: 12px; line-height: 1.5; white-space: pre-wrap; }
  .user { align-self: flex-end; background: #2563eb; color: #fff; }
  .bot { align-self: flex-start; background: #22262f; border: 1px solid #2a2e37; }
  form { display: flex; gap: 8px; padding: 12px 16px; border-top: 1px solid #2a2e37; }
  input { flex: 1; padding: 12px 14px; border-radius: 10px; border: 1px solid #2a2e37;
          background: #1a1d24; color: #e8eaed; font-size: 15px; }
  button { padding: 12px 20px; border-radius: 10px; border: none; background: #2563eb;
           color: #fff; font-weight: 600; cursor: pointer; }
  button:disabled { opacity: .5; cursor: default; }
</style>
</head>
<body>
  <header>
    <strong>chatai</strong>
    <span class="who" id="who"></span>
    <span>
      <a href="#" id="clear">ล้างประวัติ</a>
      <a href="/logout">ออกจากระบบ</a>
    </span>
  </header>
  <div id="chat"></div>
  <form id="form">
    <input id="input" placeholder="พิมพ์ข้อความ..." autocomplete="off" />
    <button id="send" type="submit">ส่ง</button>
  </form>
<script>
const chat = document.getElementById('chat');
const input = document.getElementById('input');
const send = document.getElementById('send');

function add(role, text) {
  const d = document.createElement('div');
  d.className = 'msg ' + role;
  d.textContent = text;
  chat.appendChild(d);
  chat.scrollTop = chat.scrollHeight;
}

fetch('/api/me').then(r => r.ok ? r.json() : null).then(d => {
  if (d && d.user) document.getElementById('who').textContent =
    (d.user.name || d.user.email) + ' · ' + d.user.provider;
}).catch(() => {});

// โหลดประวัติของผู้ใช้คนนี้ (server คืนเฉพาะกล่องตัวเอง)
fetch('/api/history').then(r => r.ok ? r.json() : null).then(d => {
  if (d && Array.isArray(d.messages))
    d.messages.forEach(m => add(m.role === 'user' ? 'user' : 'bot', m.content));
}).catch(() => {});

document.getElementById('clear').addEventListener('click', async (e) => {
  e.preventDefault();
  if (!confirm('ล้างประวัติแชตทั้งหมด?')) return;
  await fetch('/api/chat/clear', { method: 'POST' }).catch(() => {});
  chat.innerHTML = '';
});

document.getElementById('form').addEventListener('submit', async (e) => {
  e.preventDefault();
  const text = input.value.trim();
  if (!text) return;
  input.value = '';
  add('user', text);
  send.disabled = true;
  const bot = document.createElement('div');   // ฟองคำตอบที่จะไหลเข้าทีละคำ
  bot.className = 'msg bot';
  chat.appendChild(bot);
  try {
    const res = await fetch('/api/chat/stream', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ message: text }),
    });
    if (!res.ok || !res.body) {
      const d = await res.json().catch(() => ({}));
      bot.textContent = '[error] ' + (d.error || res.status);
    } else {
      const reader = res.body.getReader();
      const dec = new TextDecoder();
      let buf = '';
      while (true) {
        const { value, done } = await reader.read();
        if (done) break;
        buf += dec.decode(value, { stream: true });
        const parts = buf.split('\n\n');
        buf = parts.pop();                        // เก็บเศษที่ยังไม่ครบ event
        for (const block of parts) {
          const line = block.trim();
          if (!line.startsWith('data:')) continue;
          let evt; try { evt = JSON.parse(line.slice(5).trim()); } catch { continue; }
          if (evt.delta) { bot.textContent += evt.delta; chat.scrollTop = chat.scrollHeight; }
          else if (evt.error) bot.textContent += '\n[error] ' + evt.error;
        }
      }
    }
  } catch (err) {
    bot.textContent = '[error] ต่อ server ไม่ได้';
  } finally {
    send.disabled = false;
    input.focus();
  }
});
</script>
</body>
</html>
