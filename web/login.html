<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>chatai — เข้าสู่ระบบ</title>
<style>
  :root { color-scheme: light dark; }
  * { box-sizing: border-box; }
  body { margin: 0; min-height: 100vh; display: grid; place-items: center;
         font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
         background: #0f1115; color: #e8eaed; padding: 16px; }
  .card { width: 100%; max-width: 360px; background: #1a1d24; border: 1px solid #2a2e37;
          border-radius: 16px; padding: 32px 24px; text-align: center; }
  h1 { margin: 0 0 4px; font-size: 24px; }
  p.sub { margin: 0 0 28px; color: #9aa0ac; font-size: 14px; }
  a.btn { display: flex; align-items: center; justify-content: center; gap: 10px;
          width: 100%; padding: 12px 16px; margin: 10px 0; border-radius: 10px;
          text-decoration: none; font-weight: 600; font-size: 15px;
          border: 1px solid #2a2e37; color: #e8eaed; background: #22262f; }
  a.btn:hover { background: #2a2f3a; }
  a.google { background: #fff; color: #1f1f1f; border-color: #dadce0; }
  a.google:hover { background: #f1f3f4; }
  .note { margin-top: 22px; font-size: 12px; color: #6b7280; line-height: 1.6; }
</style>
</head>
<body>
  <div class="card">
    <h1>chatai</h1>
    <p class="sub">เข้าสู่ระบบเพื่อเริ่มแชต</p>
    <a class="btn google" href="/auth/google">เข้าสู่ระบบด้วย Google</a>
    <a class="btn" href="/auth/github">เข้าสู่ระบบด้วย GitHub</a>
    <div class="note">ระบบจะพาไปหน้า login ของผู้ให้บริการ แล้วกลับมาที่นี่อย่างปลอดภัย<br>เราเก็บเฉพาะชื่อ/อีเมลเพื่อระบุตัวตน</div>
  </div>
</body>
</html>
