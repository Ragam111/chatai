# CI — chatai: lint + tests (stdlib-only Python, no extra deps)
# Single workflow combining all checks

name: CI

on:
  push:
    branches: ["**"]
  pull_request:
    branches: [main]

jobs:
  lint:
    name: Lint (pyflakes)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install --quiet pyflakes
      - name: pyflakes
        run: python -m pyflakes server.py app/

  test:
    name: Tests (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    needs: lint
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: unittest discover
        run: python -m unittest discover -s tests -p "test_*.py" -v
        # หมายเหตุ: app ใช้ stdlib ล้วน ไม่ต้อง pip install เพิ่ม
        env:
          CHAT_BACKEND: echo   # รัน tests โดยไม่ต้อง Ollama/OpenAI จริง
          SESSION_SECRET: ci-test-secret-not-real

  summary:
    name: CI Summary
    runs-on: ubuntu-latest
    needs: [lint, test]
    if: always()
    steps:
      - name: Result
        run: |
          echo "lint: ${{ needs.lint.result }}"
          echo "test: ${{ needs.test.result }}"
          if [ "${{ needs.lint.result }}" = "success" ] && [ "${{ needs.test.result }}" = "success" ]; then
            echo "All checks passed"
          else
            echo "One or more checks failed" && exit 1
          fi
